package:
  name: r-biopipen.utils
  version: 0.4.4

source:
  path: ..

build:
  number: 2
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  host:
    - r-base
    - r-bracer
    - r-digest
    - r-doubletfinder >=2.0.6
    - r-enrichit
    - r-jsonlite
    - r-logger
    - r-r6
    - r-sccdc
    - r-seurat
    - r-testthat
    - r-tibble
    - r-tidyseurat
    - r-zip
    - pwwang::bioconductor-data-packages
    - bioconda::bioconductor-biocparallel
    - bioconda::bioconductor-celda
    - bioconda::bioconductor-mygene
    - bioconda::bioconductor-scdblfinder
    - bioconda::bioconductor-ucell
    - bioconda::bioconductor-destiny
    - bioconda::bioconductor-aucell
    - bioconda::bioconductor-gsva
    - bioconda::bioconductor-gseabase
    - bioconda::bioconductor-genefilter
    - r-ggplot2 >4
    - pwwang::r-scplotter
    - pwwang::r-seuratdisk
    - r-qs2
    - r-plotly
    - r-htmlwidgets

  run:
    - r-base
    - r-bracer
    - r-digest
    - r-doubletfinder >=2.0.6
    - r-enrichit
    - r-jsonlite
    - r-logger
    - r-r6
    - r-sccdc
    - r-seurat
    - r-testthat
    - r-tibble
    - r-tidyseurat
    - r-zip
    - pwwang::bioconductor-data-packages
    - bioconda::bioconductor-biocparallel
    - bioconda::bioconductor-celda
    - bioconda::bioconductor-mygene
    - bioconda::bioconductor-scdblfinder
    - bioconda::bioconductor-ucell
    - bioconda::bioconductor-destiny
    - bioconda::bioconductor-aucell
    - bioconda::bioconductor-gsva
    - bioconda::bioconductor-gseabase
    - bioconda::bioconductor-genefilter
    - r-ggplot2 >4
    - pwwang::r-scplotter
    - pwwang::r-seuratdisk
    - r-qs2
    - r-plotly
    - r-htmlwidgets

test:
  commands:
    - $R -e "library('biopipen.utils')"

about:
  home: https://github.com/pwwang/biopipen.utils.R
  license: GPL-3
  summary: Common utility R functions for biopipen processes.
  license_family: MIT
  license_file: LICENSE.md
